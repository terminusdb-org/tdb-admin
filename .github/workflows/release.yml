name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload dist package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and package
        run: npm run package
        env:
          VITE_TDB_URL: __TDB_URL_PLACEHOLDER__
          VITE_TDB_USER: admin

      - name: Determine release tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip leading 'v' for the filename, e.g. v0.1.1-rc1 → 0.1.1-rc1
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename tarball with version
        run: |
          mv dist.tar.gz "tdb-admin-${{ steps.tag.outputs.version }}.tar.gz"

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release (with immutable tag) was created manually on GitHub.
          # This step builds the dist and uploads it as a release asset.
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "tdb-admin-${{ steps.tag.outputs.version }}.tar.gz" \
            --clobber
