<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="dfrnt-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP meta tag: protects against XSS script injection.
         In the embedded deployment (tdb-admin served by TDB on the same host), all
         resources including API calls are same-origin, so 'self' covers everything.
         connect-src is set to 'self' for production; dev proxies or standalone deployments
         should override this via a server-level Content-Security-Policy response header.
         frame-ancestors cannot be enforced via meta — set it at the server level instead. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:6363; font-src 'self';" />
    <title>TDB Admin</title>
  </head>
  <body class="bg-gray-50 antialiased">
    <div id="root"></div>
    <!-- Runtime env injection (generated by docker-entrypoint.sh in container) -->
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
