# ═══════════════════════════════════════════════════════════════════════════════
# TDB Admin — Local Development & E2E Testing
# ═══════════════════════════════════════════════════════════════════════════════
#
# Starts TerminusDB + Vite dev server. Mirrors production architecture:
# TerminusDB is NEVER directly exposed to the host. All API access goes
# through the Vite dev server proxy on port 4100.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up
#   # tdb-admin available at http://localhost:4100
#   # E2E tests: BASE_URL=http://localhost:4100 npm run test:e2e
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ---------- TerminusDB (internal only — no host port) ----------
  terminusdb:
    image: terminusdb/terminusdb-server
    environment:
      TERMINUSDB_SERVER_PORT: "6363"
      TERMINUSDB_HTTPS_ENABLED: "false"
      TERMINUSDB_AUTOLOGIN_ENABLED: "false"
      TERMINUSDB_ENABLE_DASHBOARD: "true"
      TERMINUSDB_LOG_FORMAT: "json"
      TERMINUSDB_ADMIN_PASS: "localdev"
    volumes:
      - tdb-data:/app/terminusdb/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6363/api/ok"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks:
      - internal

  # ---------- Vite Dev Server (host-exposed on port 4100) ----------
  tdb-admin-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Empty string = same-origin: browser requests go to localhost:4100,
      # Vite proxy forwards /api to TerminusDB on the internal network.
      VITE_TDB_URL: ""
      VITE_TDB_USER: "admin"
      # Vite proxy target — routes /api/* requests to TerminusDB via internal network
      TDB_PROXY_TARGET: "http://terminusdb:6363"
    ports:
      - "4100:4100"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      terminusdb:
        condition: service_healthy
    networks:
      - internal

volumes:
  tdb-data:
  node_modules:

networks:
  internal:
    driver: bridge
